spring:
  application:
    name: book-api

  datasource:
    url: jdbc:postgresql://localhost:5432/bookdatabase
    username: postgres
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000

